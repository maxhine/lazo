# Lazo relay: forwards Live Activity pushes from the Mac app to Apple (APNs).
# Deploy: see README.md. Secrets (never in git): APNS_KEY, APNS_KEY_ID.
name = "lazo-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
APNS_TEAM_ID = "TEAM_ID_PENDIENTE"
APNS_TOPIC = "com.sarca.lazo.isla.push-type.liveactivity"

[observability]
enabled = false
