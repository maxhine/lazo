name: NotchBuddy
options:
  bundleIdPrefix: com.sarca.lazo
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true

# DebugCloud = Debug, but signed with iCloud (CloudKit) and push entitlements
# and compiled with PHONE_LINK, for the iPhone link spike. ReleaseCloud = the
# same for a Developer ID build with its provisioning profile
# (scripts/cloud-test-build.sh); a Developer ID profile only allows the
# Production CloudKit environment, so the iPhone joins it with the
# LazoPhoneProduction scheme. Release also compiles PHONE_LINK (the sync
# stays off until turned on in Settings); Debug stays unsigned without it.
# FluidAudio (Apache-2.0): Parakeet speech-to-text and speaker diarization on the Mac's
# Neural Engine, for Flow dictation and the Notetaker (GitHub build only). Its models are
# downloaded from Hugging Face only when the user clicks Download in Lazo Flow → Settings.
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7

configs:
  Debug: debug
  DebugCloud: debug
  Release: release
  ReleaseCloud: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    OTHER_SWIFT_FLAGS: "-strict-concurrency=complete"
    # Prevent Xcode from scanning Swift source and rewriting Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
    DebugCloud:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      DEVELOPMENT_TEAM: ""
    Release:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: ""
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      CODE_SIGN_ENTITLEMENTS: Resources/Lazo.entitlements
    ReleaseCloud:
      CODE_SIGNING_REQUIRED: YES
      CODE_SIGNING_ALLOWED: YES
      CODE_SIGN_IDENTITY: "Developer ID Application"
      DEVELOPMENT_TEAM: ""
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

schemes:
  NotchBuddy:
    build:
      targets:
        NotchBuddy: all
    run:
      config: Debug
    archive:
      config: Release
  NotchBuddyCloud:
    build:
      targets:
        NotchBuddy: all
    run:
      config: DebugCloud
    archive:
      config: Release

targets:
  NotchBuddy:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "Phone/**"
          - "Widgets/**"
          - "NotificationContent/**"
      - path: Assets.xcassets
        buildPhase: resources
      - path: Resources/sounds
        buildPhase: resources
        type: folder
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      # What's new after an update, once in the notch (WhatsNewViews.swift; GitHub build)
      - path: Resources/whats-new.json
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Lazo
        CFBundleDisplayName: Lazo
        CFBundleIdentifier: com.sarca.lazo.isla
        CFBundleVersion: "20"
        CFBundleShortVersionString: "0.5.3"
        CFBundlePackageType: APPL
        LSUIElement: YES
        NSHighResolutionCapable: YES
        NSSupportsAutomaticGraphicsSwitching: YES
        NSAppleEventsUsageDescription: "Pour sauter au terminal, envoyer des mails et piloter Musique et Spotify."
        NSMicrophoneUsageDescription: "Lazo uses the microphone when you dictate, and to note your calls when you ask it to."
        NSAudioCaptureUsageDescription: "Lazo records what your Mac plays only while you note a call, to write down what the other people say."
        NSSpeechRecognitionUsageDescription: "Lazo turns your voice into the text of a chat message."
        NSAccessibilityUsageDescription: "Pour lire le titre de la fenêtre active et l'attacher comme contexte."
        NSContactsUsageDescription: "Lazo looks up an email address when you ask it, by voice, to prepare an email."
        NSFocusStatusUsageDescription: "Lazo stays quiet about new WhatsApp messages while a Focus is on."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations:
          - en
          - ar
          - bn
          - de
          - es
          - fr
          - hi
          - id
          - pt-BR
          - ru
          - th
          - tr
          - zh-Hans
          - zh-Hant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarca.lazo.isla
        PRODUCT_NAME: Lazo
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ENABLE_SANDBOX: NO
      configs:
        DebugCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/LazoCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG PHONE_LINK"
          # The build run every day from Xcode: optimized like Release, so Nudo's
          # drawing costs what it costs for users (unoptimized Swift was ~2× the CPU).
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        # The distributed build carries the iPhone sync (off until the user
        # turns it on in Settings), so it needs iCloud and its Developer ID profile.
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/LazoReleaseCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PHONE_LINK
          PROVISIONING_PROFILE_SPECIFIER: "Lazo Developer ID"
        ReleaseCloud:
          CODE_SIGN_ENTITLEMENTS: Resources/LazoReleaseCloud.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: PHONE_LINK
          PROVISIONING_PROFILE_SPECIFIER: "Lazo Developer ID"
    dependencies:
      - package: FluidAudio
    postBuildScripts:
      - name: "Write Git Hash to Info.plist"
        script: |
          HASH=$(git -C "${SRCROOT}/.." rev-parse --short HEAD 2>/dev/null || echo "unknown")
          /usr/libexec/PlistBuddy -c "Set :LazoGitHash ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :LazoGitHash string ${HASH}" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
        showEnvVars: false

